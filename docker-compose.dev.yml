# Dev-Override: Hot Reload in Containern.
# Aufruf: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

x-dev-api-build: &dev-api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: dev

services:
  migrate:
    build: *dev-api-build

  api:
    build: *dev-api-build
    command:
      [
        "sh",
        "-c",
        "npm install --no-audit --no-fund && npm run build -w @projectplaner/shared && npm run dev -w @projectplaner/api",
      ]
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"
      LOG_LEVEL: debug
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    ports: !reset
      - "127.0.0.1:3000:3000"
    restart: "no"

  worker:
    build: *dev-api-build
    command:
      [
        "sh",
        "-c",
        "npm install --no-audit --no-fund && npm run build -w @projectplaner/shared && npm run worker -w @projectplaner/api",
      ]
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"
      LOG_LEVEL: debug
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    command:
      [
        "sh",
        "-c",
        "npm install --no-audit --no-fund && npm run build -w @projectplaner/shared && npm run dev -w @projectplaner/web -- --host 0.0.0.0",
      ]
    environment:
      VITE_API_TARGET: http://api:3000
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports: !reset
      - "5173:5173"
    restart: "no"

  db:
    ports:
      - "127.0.0.1:3306:3306"

  # DB-Inspektion nur auf Anfrage: docker compose ... --profile tools up
  adminer:
    image: adminer:5
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  # Backups im Dev-Betrieb nur auf Anfrage
  backup:
    profiles: ["backup"]

volumes:
  api_node_modules:
  worker_node_modules:
  web_node_modules:

networks:
  # In Dev muss das Backend-Netz Ports nach außen freigeben können (DB auf 127.0.0.1:3306).
  backend:
    internal: false
